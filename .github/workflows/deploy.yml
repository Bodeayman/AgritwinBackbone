name: Deploy to EC2

on:
  push:
    branches: [main, master]

  workflow_dispatch:
    inputs:
      skip_tests:
        description: "Skip tests before deployment"
        required: false
        default: "false"
        type: boolean

env:
  DEPLOY_DIR: /opt/agritwin-backend
  DOCKER_IMAGE_BACKBONE: agritwin-backbone
  DOCKER_IMAGE_CLASSICAL: agritwin-classical-classifier
  DOCKER_IMAGE_VLM: agritwin-vlm-classifier
  COMPOSE_FILE: docker-compose.prod.yml

jobs:
  test:
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.skip_tests != 'true' }}

    services:
      db:
        image: postgis/postgis:15-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: agritwin_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d agritwin_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "backbone/requirements.txt"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backbone/requirements.txt

      - name: Wait for database
        run: |
          for i in {1..30}; do
            if (echo > /dev/tcp/127.0.0.1/5432) 2>/dev/null; then
              echo "Database is accepting connections!"
              break
            fi
            echo "Waiting for database..."
            sleep 2
          done

      - name: Run tests
        env:
          TEST_DATABASE_URL: postgresql://postgres:testpassword@localhost:5432/agritwin_test
          DATABASE_URL: postgresql://postgres:testpassword@localhost:5432/agritwin_test
          MINIO_ENDPOINT: localhost:9000
          MINIO_ACCESS_KEY: minioadmin
          MINIO_SECRET_KEY: REDACTED_MINIO_SECRET
          MINIO_SECURE: "False"
          MINIO_BUCKET_NAME: agritwin-test-bucket
        run: pytest backbone/tests/ -v

  deploy:
    runs-on: ubuntu-latest
    needs: test
    if: ${{ always() && (needs.test.result == 'success' || github.event.inputs.skip_tests == 'true') }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker images
        run: |
          docker build -f backbone/Dockerfile -t ${{ env.DOCKER_IMAGE_BACKBONE }}:${{ github.sha }} backbone
          docker tag ${{ env.DOCKER_IMAGE_BACKBONE }}:${{ github.sha }} ${{ env.DOCKER_IMAGE_BACKBONE }}:latest
          docker build -f classical-classifier/Dockerfile -t ${{ env.DOCKER_IMAGE_CLASSICAL }}:${{ github.sha }} classical-classifier
          docker tag ${{ env.DOCKER_IMAGE_CLASSICAL }}:${{ github.sha }} ${{ env.DOCKER_IMAGE_CLASSICAL }}:latest
          docker build -f vlm-classifier/Dockerfile -t ${{ env.DOCKER_IMAGE_VLM }}:${{ github.sha }} vlm-classifier
          docker tag ${{ env.DOCKER_IMAGE_VLM }}:${{ github.sha }} ${{ env.DOCKER_IMAGE_VLM }}:latest

      - name: Save Docker images
        run: |
          docker save \
            ${{ env.DOCKER_IMAGE_BACKBONE }}:${{ github.sha }} ${{ env.DOCKER_IMAGE_BACKBONE }}:latest \
            ${{ env.DOCKER_IMAGE_CLASSICAL }}:${{ github.sha }} ${{ env.DOCKER_IMAGE_CLASSICAL }}:latest \
            ${{ env.DOCKER_IMAGE_VLM }}:${{ github.sha }} ${{ env.DOCKER_IMAGE_VLM }}:latest \
            | gzip > agritwin-images.tar.gz

      - name: Copy images to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "agritwin-images.tar.gz,${{ env.COMPOSE_FILE }}"
          target: ${{ env.DEPLOY_DIR }}
          strip_components: 0

      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            DEPLOY_DIR="${{ env.DEPLOY_DIR }}"
            COMMIT_SHA="${{ github.sha }}"
            COMPOSE_FILE="${{ env.COMPOSE_FILE }}"
            BB_IMAGE="${{ env.DOCKER_IMAGE_BACKBONE }}"
            CC_IMAGE="${{ env.DOCKER_IMAGE_CLASSICAL }}"
            VLM_IMAGE="${{ env.DOCKER_IMAGE_VLM }}"

            echo "=== AgriTwin Deployment: $COMMIT_SHA ==="

            # Navigate to deploy directory
            cd "$DEPLOY_DIR"

            echo "Deploy directory contents:"
            ls -la

            # Ensure .env exists
            if [ ! -f .env ]; then
              echo "ERROR: .env file not found at $DEPLOY_DIR/.env"
              echo "Please create it from .env.example with production values."
              exit 1
            fi

            # Ensure compose file exists (download from repo as fallback)
            if [ ! -f "$COMPOSE_FILE" ]; then
              echo "$COMPOSE_FILE missing; downloading from repository..."
              curl -sfL -o "$COMPOSE_FILE" "https://raw.githubusercontent.com/${{ github.repository }}/$COMMIT_SHA/$COMPOSE_FILE"
            fi
            if [ ! -f "$COMPOSE_FILE" ]; then
              echo "ERROR: $COMPOSE_FILE not available at $DEPLOY_DIR/$COMPOSE_FILE"
              exit 1
            fi

            # Install standalone docker-compose (snap docker's compose plugin is file-sandboxed)
            COMPOSE_BIN="$DEPLOY_DIR/docker-compose"
            if [ ! -x "$COMPOSE_BIN" ]; then
              echo "Installing standalone docker-compose..."
              curl -sfL -o "$COMPOSE_BIN" "https://github.com/docker/compose/releases/download/v2.24.6/docker-compose-linux-x86_64"
              chmod +x "$COMPOSE_BIN"
            fi
            COMPOSE="$COMPOSE_BIN -f $DEPLOY_DIR/$COMPOSE_FILE"

            # Preserve the current deployed images for rollback (if any)
            for IMG in "$BB_IMAGE" "$CC_IMAGE" "$VLM_IMAGE"; do
              if docker image inspect "$IMG:latest" >/dev/null 2>&1; then
                docker tag "$IMG:latest" "$IMG:previous"
                echo "Saved current image $IMG as $IMG:previous"
              fi
            done

            # Load the new Docker images
            echo "Loading Docker images..."
            docker load < agritwin-images.tar.gz
            rm -f agritwin-images.tar.gz

            # Tag the images
            docker tag "$BB_IMAGE:$COMMIT_SHA" "$BB_IMAGE:latest"
            docker tag "$CC_IMAGE:$COMMIT_SHA" "$CC_IMAGE:latest"
            docker tag "$VLM_IMAGE:$COMMIT_SHA" "$VLM_IMAGE:latest"

            # Seed the classical-classifier weights volume.
            # The snap docker daemon cannot bind-mount host paths under /opt,
            # so weights live in a named volume populated via `docker cp` (which
            # reads the source through the client, not the daemon).
            WEIGHTS_VOLUME="agritwin_classical_weights"
            if [ -d "$DEPLOY_DIR/weights" ] && [ -n "$(ls -A "$DEPLOY_DIR/weights" 2>/dev/null)" ]; then
              echo "Seeding weights volume ($WEIGHTS_VOLUME) from $DEPLOY_DIR/weights..."
              docker volume create "$WEIGHTS_VOLUME" >/dev/null 2>&1 || true
              docker rm -f agritwin_weights_seed >/dev/null 2>&1 || true
              docker create --name agritwin_weights_seed -v "$WEIGHTS_VOLUME":/weights alpine:3.20 true >/dev/null 2>&1
              docker cp "$DEPLOY_DIR/weights/." agritwin_weights_seed:/weights/
              docker rm -f agritwin_weights_seed >/dev/null 2>&1
              docker run --rm -v "$WEIGHTS_VOLUME":/weights alpine:3.20 ls -lh /weights/
            else
              echo "WARNING: no weights found at $DEPLOY_DIR/weights — classifier model load will fail."
            fi

            # Bring up full stack on first deploy, otherwise just recreate app services
            echo "Recreating services..."
            if [ -z "$(docker ps -aq -f name=agritwin_db)" ]; then
              echo "First deploy detected; starting full stack (db, minio, rabbitmq, app)..."
              $COMPOSE up -d --remove-orphans
            else
              $COMPOSE up -d --force-recreate --no-deps backbone classical-classifier vlm-classifier --remove-orphans
            fi

            # Give the containers time to boot, then do a single health check per service
            echo "Waiting 25s for the app to start..."
            sleep 25
            echo "Checking application health..."
            HEALTH_OK=1
            if curl -sf http://localhost:8000/ > /dev/null 2>&1; then
              echo "backbone is healthy!"
            else
              echo "ERROR: backbone failed health check"
              HEALTH_OK=0
            fi
            if curl -sf http://localhost:8001/health > /dev/null 2>&1; then
              echo "classical-classifier is healthy!"
            else
              echo "ERROR: classical-classifier failed health check"
              HEALTH_OK=0
            fi
            if curl -sf http://localhost:8002/health > /dev/null 2>&1; then
              echo "vlm-classifier is healthy!"
            else
              echo "ERROR: vlm-classifier failed health check"
              HEALTH_OK=0
            fi

            if [ "$HEALTH_OK" != "1" ]; then
              echo "----- agritwin_backbone logs -----"
              docker logs agritwin_backbone --tail 60 2>&1 || echo "(no logs available)"
              echo "----- agritwin_classical_classifier logs -----"
              docker logs agritwin_classical_classifier --tail 60 2>&1 || echo "(no logs available)"
              echo "----- agritwin_vlm_classifier logs -----"
              docker logs agritwin_vlm_classifier --tail 60 2>&1 || echo "(no logs available)"
              echo "-----------------------------"
              echo "Rolling back to previous images..."
              for IMG in "$BB_IMAGE" "$CC_IMAGE" "$VLM_IMAGE"; do
                if docker image inspect "$IMG:previous" >/dev/null 2>&1; then
                  docker tag "$IMG:previous" "$IMG:latest"
                  echo "Rolled back $IMG to previous image."
                fi
              done
              "$DEPLOY_DIR/docker-compose" -f "$DEPLOY_DIR/$COMPOSE_FILE" up -d --force-recreate --no-deps backbone classical-classifier vlm-classifier --remove-orphans
              echo "Rollback to previous images completed."
              exit 1
            fi

            echo "$COMMIT_SHA" > "$DEPLOY_DIR/.previous_commit"

            # Clean up old images
            docker image prune -f

            echo "=== Deployment complete: $COMMIT_SHA ==="
            $COMPOSE ps

      - name: Verify deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "=== Verifying deployment ==="
            "${{ env.DEPLOY_DIR }}/docker-compose" -f ${{ env.DEPLOY_DIR }}/${{ env.COMPOSE_FILE }} ps
            curl -sf http://localhost:8000/ && echo " backbone OK"
            curl -sf http://localhost:8001/health && echo " classical OK"
            curl -sf http://localhost:8002/health && echo " vlm OK"

      - name: Cleanup local artifacts
        if: always()
        run: rm -f agritwin-images.tar.gz

  autofix:
    runs-on: ubuntu-latest
    needs: deploy
    if: ${{ always() && needs.deploy.result == 'failure' }}
    permissions:
      contents: write
      pull-requests: write
      issues: write

    services:
      db:
        image: postgis/postgis:15-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: agritwin_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d agritwin_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "backbone/requirements.txt"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backbone/requirements.txt

      - name: Fetch web container logs from EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          printf '%s\n' "$EC2_SSH_KEY" > /tmp/ec2_key
          chmod 600 /tmp/ec2_key
          ssh -i /tmp/ec2_key -o StrictHostKeyChecking=no \
            "$EC2_USERNAME@$EC2_HOST" \
            "docker logs agritwin_backbone --tail 200 2>&1 || echo '(no logs available)'" \
            > /tmp/deploy_web_logs.txt || true
          echo "---- captured web logs ----"
          tail -c 4000 /tmp/deploy_web_logs.txt

      - name: Wait for database
        run: |
          for i in {1..30}; do
            if (echo > /dev/tcp/127.0.0.1/5432) 2>/dev/null; then
              echo "Database is accepting connections!"
              break
            fi
            echo "Waiting for database..."
            sleep 2
          done

      - name: Run autofix
        env:
          TEST_DATABASE_URL: postgresql://postgres:testpassword@localhost:5432/agritwin_test
          DATABASE_URL: postgresql://postgres:testpassword@localhost:5432/agritwin_test
          MINIO_ENDPOINT: localhost:9000
          MINIO_ACCESS_KEY: minioadmin
          MINIO_SECRET_KEY: REDACTED_MINIO_SECRET
          MINIO_SECURE: "False"
          MINIO_BUCKET_NAME: agritwin-test-bucket
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          AUTOFIX_MODE: deploy
          AUTOFIX_MAX_ATTEMPTS: 1
        run: |
          python .github/scripts/autofix.py /tmp/deploy_web_logs.txt 2>&1 || true
