name: Deploy to EC2

on:
  push:
    branches: [main, master]

  workflow_dispatch:
    inputs:
      skip_tests:
        description: "Skip tests before deployment"
        required: false
        default: "false"
        type: boolean

env:
  DEPLOY_DIR: /opt/agritwin-backend
  DOCKER_IMAGE_NAME: agritwin-web

jobs:
  test:
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.skip_tests != 'true' }}

    services:
      db:
        image: postgis/postgis:15-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: agritwin_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d agritwin_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "backbone/requirements.txt"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backbone/requirements.txt

      - name: Wait for database
        run: |
          for i in {1..30}; do
            if (echo > /dev/tcp/127.0.0.1/5432) 2>/dev/null; then
              echo "Database is accepting connections!"
              break
            fi
            echo "Waiting for database..."
            sleep 2
          done

      - name: Run tests
        env:
          TEST_DATABASE_URL: postgresql://postgres:testpassword@localhost:5432/agritwin_test
          DATABASE_URL: postgresql://postgres:testpassword@localhost:5432/agritwin_test
          MINIO_ENDPOINT: localhost:9000
          MINIO_ACCESS_KEY: minioadmin
          MINIO_SECRET_KEY: REDACTED_MINIO_SECRET
          MINIO_SECURE: "False"
          MINIO_BUCKET_NAME: agritwin-test-bucket
        run: pytest backbone/tests/ -v

  deploy:
    runs-on: ubuntu-latest
    needs: test
    if: ${{ always() && (needs.test.result == 'success' || github.event.inputs.skip_tests == 'true') }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          docker build -f backbone/Dockerfile -t ${{ env.DOCKER_IMAGE_NAME }}:${{ github.sha }} backbone
          docker tag ${{ env.DOCKER_IMAGE_NAME }}:${{ github.sha }} ${{ env.DOCKER_IMAGE_NAME }}:latest

      - name: Save Docker image
        run: |
          docker save ${{ env.DOCKER_IMAGE_NAME }}:${{ github.sha }} ${{ env.DOCKER_IMAGE_NAME }}:latest | gzip > agritwin-image.tar.gz

      - name: Copy image to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "agritwin-image.tar.gz,docker-compose.yml"
          target: ${{ env.DEPLOY_DIR }}
          strip_components: 0

      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            DEPLOY_DIR="${{ env.DEPLOY_DIR }}"
            IMAGE_NAME="${{ env.DOCKER_IMAGE_NAME }}"
            COMMIT_SHA="${{ github.sha }}"

            echo "=== AgriTwin Deployment: $COMMIT_SHA ==="

            # Navigate to deploy directory
            cd "$DEPLOY_DIR"

            echo "Deploy directory contents:"
            ls -la

            # Ensure .env exists
            if [ ! -f .env ]; then
              echo "ERROR: .env file not found at $DEPLOY_DIR/.env"
              echo "Please create it from .env.example with production values."
              exit 1
            fi

            # Ensure docker-compose.yml exists (download from repo as fallback)
            if [ ! -f docker-compose.yml ]; then
              echo "docker-compose.yml missing; downloading from repository..."
              curl -sfL -o docker-compose.yml "https://raw.githubusercontent.com/${{ github.repository }}/$COMMIT_SHA/docker-compose.yml"
            fi
            if [ ! -f docker-compose.yml ]; then
              echo "ERROR: docker-compose.yml not available at $DEPLOY_DIR/docker-compose.yml"
              exit 1
            fi

            # Install standalone docker-compose (snap docker's compose plugin is file-sandboxed)
            COMPOSE_BIN="$DEPLOY_DIR/docker-compose"
            if [ ! -x "$COMPOSE_BIN" ]; then
              echo "Installing standalone docker-compose..."
              curl -sfL -o "$COMPOSE_BIN" "https://github.com/docker/compose/releases/download/v2.24.6/docker-compose-linux-x86_64"
              chmod +x "$COMPOSE_BIN"
            fi
            COMPOSE="$COMPOSE_BIN -f $DEPLOY_DIR/docker-compose.yml"

            # Preserve the current deployed image for rollback (if any)
            if docker image inspect "$IMAGE_NAME:latest" >/dev/null 2>&1; then
              docker tag "$IMAGE_NAME:latest" "$IMAGE_NAME:previous"
              echo "Saved current image as $IMAGE_NAME:previous"
            fi

            # Load the new Docker image
            echo "Loading Docker image..."
            docker load < agritwin-image.tar.gz
            rm -f agritwin-image.tar.gz

            # Tag the image
            docker tag "$IMAGE_NAME:$COMMIT_SHA" "$IMAGE_NAME:latest"

            # Record the previous commit for reference
            PREVIOUS_IMAGE=$(docker inspect --format='{{.Config.Image}}' agritwin_web 2>/dev/null || echo "none")
            echo "Previous image: $PREVIOUS_IMAGE"
            echo "$PREVIOUS_IMAGE" > "$DEPLOY_DIR/.previous_image"

            # Bring up full stack on first deploy (db/minio/rabbitmq), otherwise just recreate web
            echo "Recreating services..."
            if [ -z "$(docker ps -aq -f name=agritwin_db)" ]; then
              echo "First deploy detected; starting full stack (db, minio, rabbitmq, web)..."
              $COMPOSE up -d
            else
              $COMPOSE up -d --force-recreate --no-deps web
            fi

            # Give the container time to boot, then do a single health check
            echo "Waiting 20s for the app to start..."
            sleep 20
            echo "Checking application health..."
            if curl -sf http://localhost:${API_PORT:-8000}/ > /dev/null 2>&1; then
              echo "Application is healthy!"
            else
              echo "ERROR: Application failed health check"
              echo "----- agritwin_web logs -----"
              docker logs agritwin_web --tail 60 2>&1 || echo "(no logs available)"
              echo "-----------------------------"
              echo "Rolling back to previous image..."
              if docker image inspect "$IMAGE_NAME:previous" >/dev/null 2>&1; then
                docker tag "$IMAGE_NAME:previous" "$IMAGE_NAME:latest"
                "$DEPLOY_DIR/docker-compose" -f "$DEPLOY_DIR/docker-compose.yml" up -d --force-recreate --no-deps web
                echo "Rollback to previous image completed."
              else
                echo "No previous image found; leaving current state for manual inspection."
              fi
              exit 1
            fi

            # Clean up old images
            docker image prune -f

            echo "=== Deployment complete: $COMMIT_SHA ==="
            $COMPOSE ps

      - name: Verify deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "=== Verifying deployment ==="
            "${{ env.DEPLOY_DIR }}/docker-compose" -f ${{ env.DEPLOY_DIR }}/docker-compose.yml ps
            curl -sf http://localhost:${API_PORT:-8000}/ || echo "WARNING: Health check failed"

      - name: Cleanup local artifacts
        if: always()
        run: rm -f agritwin-image.tar.gz

  autofix:
    runs-on: ubuntu-latest
    needs: deploy
    if: ${{ always() && needs.deploy.result == 'failure' }}
    permissions:
      contents: write
      pull-requests: write
      issues: write

    services:
      db:
        image: postgis/postgis:15-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: agritwin_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d agritwin_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "backbone/requirements.txt"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backbone/requirements.txt

      - name: Fetch web container logs from EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          printf '%s\n' "$EC2_SSH_KEY" > /tmp/ec2_key
          chmod 600 /tmp/ec2_key
          ssh -i /tmp/ec2_key -o StrictHostKeyChecking=no \
            "$EC2_USERNAME@$EC2_HOST" \
            "docker logs agritwin_web --tail 200 2>&1 || echo '(no logs available)'" \
            > /tmp/deploy_web_logs.txt || true
          echo "---- captured web logs ----"
          tail -c 4000 /tmp/deploy_web_logs.txt

      - name: Wait for database
        run: |
          for i in {1..30}; do
            if (echo > /dev/tcp/127.0.0.1/5432) 2>/dev/null; then
              echo "Database is accepting connections!"
              break
            fi
            echo "Waiting for database..."
            sleep 2
          done

      - name: Run autofix
        env:
          TEST_DATABASE_URL: postgresql://postgres:testpassword@localhost:5432/agritwin_test
          DATABASE_URL: postgresql://postgres:testpassword@localhost:5432/agritwin_test
          MINIO_ENDPOINT: localhost:9000
          MINIO_ACCESS_KEY: minioadmin
          MINIO_SECRET_KEY: REDACTED_MINIO_SECRET
          MINIO_SECURE: "False"
          MINIO_BUCKET_NAME: agritwin-test-bucket
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          AUTOFIX_MODE: deploy
          AUTOFIX_MAX_ATTEMPTS: 1
        run: |
          python .github/scripts/autofix.py /tmp/deploy_web_logs.txt 2>&1 || true
