name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      db:
        image: postgis/postgis:15-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: agritwin_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d agritwin_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Wait for database
        run: |
          for i in {1..30}; do
            if (echo > /dev/tcp/127.0.0.1/5432) 2>/dev/null; then
              echo "Database is accepting connections!"
              break
            fi
            echo "Waiting for database..."
            sleep 2
          done

      - name: Run tests
        env:
          TEST_DATABASE_URL: postgresql://postgres:testpassword@localhost:5432/agritwin_test
          DATABASE_URL: postgresql://postgres:testpassword@localhost:5432/agritwin_test
          MINIO_ENDPOINT: localhost:9000
          MINIO_ACCESS_KEY: minioadmin
          MINIO_SECRET_KEY: REDACTED_MINIO_SECRET
          MINIO_SECURE: "False"
          MINIO_BUCKET_NAME: agritwin-test-bucket
        run: pytest tests/ -v

      - name: Build Docker image
        run: docker build -t agritwin-web:ci-${{ github.sha }} .
