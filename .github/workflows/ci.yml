name: CI/CD Workflow

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      # We can use GitHub Actions service containers or run docker compose.
      # Running docker compose in a step is simpler and exactly matches the local setup.
      # But since we only run tests on the runner, we can spin up compose.

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Start Services (DB & MinIO)
        run: |
          docker compose up -d db minio
          # Wait for services to be healthy
          docker compose ps

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-level: '3.11'
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Wait for services to be ready
        run: |
          # Simple bash wait loop for db and minio health
          for i in {1..30}; do
            if docker compose exec -T db pg_isready -U postgres -d agritwin; then
              echo "Database is ready!"
              break
            fi
            echo "Waiting for database..."
            sleep 2
          done
          
          for i in {1..30}; do
            if curl -s -f http://localhost:9000/minio/health/live; then
              echo "MinIO is ready!"
              break
            fi
            echo "Waiting for MinIO..."
            sleep 2
          done

      - name: Run Tests
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/agritwin
          MINIO_ENDPOINT: localhost:9000
          MINIO_ACCESS_KEY: minioadmin
          MINIO_SECRET_KEY: REDACTED_MINIO_SECRET
          MINIO_SECURE: False
          MINIO_BUCKET_NAME: agritwin-test-bucket
        run: |
          pytest tests/

      - name: Build Web Docker Image
        run: |
          docker build -t agritwin-web:latest .
