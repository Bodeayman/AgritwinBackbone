version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgis/postgis:15-3.4
    container_name: agritwin_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: REDACTED_DB_PASSWORD
      POSTGRES_DB: agritwin
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MinIO Object Storage
  minio:
    image: quay.io/minio/minio:RELEASE.2024-06-06T09-36-42Z
    container_name: agritwin_minio
    command: sh -c "minio server /data --console-address ':9001'"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: REDACTED_MINIO_SECRET
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # RabbitMQ Message Queue
  rabbitmq:
    image: rabbitmq:3-management
    container_name: agritwin_rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

  # AgriTwin Backend Service
  backbone:
    build:
      context: ./backbone
      dockerfile: Dockerfile
    container_name: agritwin_backbone
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:REDACTED_DB_PASSWORD@db:5432/agritwin
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: REDACTED_MINIO_SECRET
      MINIO_SECURE: "False"
      MINIO_BUCKET_NAME: agritwin-bucket
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
      BACKEND_CORS_ORIGINS: "[\"*\"]"
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./backbone:/app
    restart: unless-stopped

  # Classical Classifier Service
  classical-classifier:
    build:
      context: ./classical-classifier
      dockerfile: Dockerfile
    container_name: agritwin_classical_classifier
    ports:
      - "8001:8000"
    environment:
      BACKEND_URL: http://backbone:8000
      INTERN_API_KEY: REDACTED_INTERN_KEY
      VLM_URL: ${VLM_URL:-http://vlm-classifier:8000}
      SEGMENTER_PATH: /weights/segmenter.pth
      CLASSIFIER_PATH: /weights/classifier.pt
      DEVICE: cpu
    volumes:
      - ./classical-classifier/weights:/weights:ro
    depends_on:
      - backbone
    restart: unless-stopped

  # VLM Classifier Service
  vlm-classifier:
    build:
      context: ./vlm-classifier
      dockerfile: Dockerfile
    container_name: agritwin_vlm_classifier
    ports:
      - "8002:8000"
    environment:
      BACKEND_URL: http://backbone:8000
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      GEMINI_MODEL: "${GEMINI_MODEL:-gemini-3.6-flash}"
    depends_on:
      - backbone
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:

networks:
  default:
    name: agritwin-network